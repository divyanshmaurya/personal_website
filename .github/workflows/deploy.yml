name: Deploy to GitHub Pages

on:
  push:
    # `main` is the intended production branch. The second entry is a temporary
    # workaround: GitHub Pages only lets the repository's DEFAULT branch deploy,
    # and the default is currently `claude/gracious-clarke-1qxqww`. Once `main`
    # is made the default branch, this second entry can be removed.
    branches: [main, claude/gracious-clarke-1qxqww]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site lives at the repository root
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
