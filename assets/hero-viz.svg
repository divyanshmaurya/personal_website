<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#bedd9f" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#bedd9f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#bedd9f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#82ad70" stop-opacity="0"/>
      <stop offset="18%" stop-color="#82ad70" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#bedd9f" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d6f3ac" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <circle cx="230" cy="185" r="185" fill="url(#g)"/>

  <!-- concentric orbit rings -->
  <g stroke="#bedd9f" fill="none">
    <circle cx="230" cy="185" r="150" stroke-opacity="0.10"/>
    <circle cx="230" cy="185" r="110" stroke-opacity="0.14"/>
    <circle cx="230" cy="185" r="66"  stroke-opacity="0.18"/>
  </g>

  <!-- EEG motor-imagery waveforms -->
  <g fill="none" stroke="url(#wave)" stroke-width="1.6" stroke-linecap="round">
    <path d="M12 96 q20 -26 40 0 t40 0 18 -20 22 20 40 0 20 -34 40 0 40 0 40 0 40 0 30 0" stroke-opacity="0.8"/>
    <path d="M12 150 q24 18 48 0 t40 -30 22 30 40 0 20 22 40 0 40 0 40 0 40 0 24 0" stroke-opacity="0.6"/>
    <path d="M12 268 q22 -20 44 0 t40 24 22 -28 40 0 20 16 40 0 40 0 40 0 40 0 24 0" stroke-opacity="0.6"/>
    <path d="M12 322 q20 24 40 0 t40 0 18 -22 22 22 40 0 20 -16 40 0 40 0 40 0 40 0 30 0" stroke-opacity="0.8"/>
  </g>

  <!-- node network -->
  <g stroke="#bedd9f" stroke-width="1" stroke-opacity="0.28">
    <line x1="230" y1="185" x2="150" y2="110"/>
    <line x1="230" y1="185" x2="326" y2="120"/>
    <line x1="230" y1="185" x2="330" y2="250"/>
    <line x1="230" y1="185" x2="138" y2="258"/>
    <line x1="150" y1="110" x2="326" y2="120"/>
    <line x1="330" y1="250" x2="138" y2="258"/>
  </g>

  <g fill="#0a0b0a" stroke="#bedd9f">
    <circle cx="150" cy="110" r="5" stroke-opacity="0.9"/>
    <circle cx="326" cy="120" r="5" stroke-opacity="0.9"/>
    <circle cx="330" cy="250" r="5" stroke-opacity="0.9"/>
    <circle cx="138" cy="258" r="5" stroke-opacity="0.9"/>
  </g>

  <!-- core node -->
  <circle cx="230" cy="185" r="13" fill="#bedd9f" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="230" cy="185" r="7" fill="#0a0b0a" stroke="#d6f3ac" stroke-width="1.4"/>
  <circle cx="230" cy="185" r="2.6" fill="#d6f3ac"/>
</svg>
